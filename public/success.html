<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moov Mauritel - نجاح العملية</title>

    <style>
        :root {
            --moov-blue: #002B66;
            --moov-orange: #FF6600;
            --moov-gradient: linear-gradient(180deg, #003380 0%, #002B66 100%);
            --bg-color: #ffffff;
            --text-dark: #121820;
            --text-muted: #666666;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body { 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 0;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }

        .header-box { 
            width: 100%; 
            background: var(--moov-gradient); 
            padding: 30px 20px 25px; 
            color: #ffffff; 
            text-align: center; 
        }

        .header-title {
            font-size: 28px;
            font-weight: 900;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-title .region {
            font-size: 13px;
            margin-right: 8px;
            font-weight: 700;
            background: var(--moov-orange);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .main-content { 
            width: 90%; 
            max-width: 400px; 
            margin: 40px auto; 
            text-align: center; 
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background-color: #22c55e;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.2);
        }

        h2 { 
            color: var(--moov-blue); 
            font-size: 24px; 
            margin: 0 0 10px; 
            font-weight: 800; 
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .footer-box { 
            width: 100%; 
            background: var(--moov-gradient); 
            padding: 30px 20px; 
            color: #ffffff; 
            text-align: center; 
            border-top-left-radius: 50% 30px; 
            border-top-right-radius: 50% 30px; 
            margin-top: auto;
        }

        .terms-text { 
            font-size: 11px; 
            margin-top: 10px; 
            color: #ffffff;
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="header-box">
    <div class="header-title">
        <span>Moov Mauritel</span><span class="region">موريتانيا</span>
    </div>
</div>

<div class="main-content">
    <div class="success-icon">✓</div>
    <h2>تم الاكتدال بنجاح!</h2>
    <p>تم التثبت من كافة بياناتك وتوثيق حسابك بنجاح. شكراً لاستخدامك خدمات Moov Mauritel.</p>
</div>

<div class="footer-box">
    <p class="terms-text">جميع الحقوق محفوظة © Moov Mauritel 2026</p>
</div>

</body>
</html>
